name: Build Arkify APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version from app.json
        # Single source of truth: every later step names the APK after the
        # version in app.json, so a release bump can never leave a step
        # pointing at a stale hard-coded filename.
        run: |
          VERSION="$(node -p "require('./app.json').expo.version")"
          echo "ARKIFY_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARKIFY_APK=Arkify-v$VERSION.apk" >> "$GITHUB_ENV"
          echo "Building Arkify v$VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        # Hosted runners ship the SDK preinstalled; just make sure licenses are
        # accepted so AGP can auto-download the platform/build-tools it needs.
        run: yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore stable signing key (cached across builds)
        # A stable signature matters twice: Android refuses updates whose
        # signature differs from the installed app, and a key that changes on
        # every CI run makes each new APK look like a different (untrusted)
        # app to Play Protect. The keystore is generated once, cached in the
        # repo's Actions cache, and reused. It lives only in CI storage and
        # the cache is scoped to this repository -- never committed. For a
        # production build, add credentials/keystore.json instead and this
        # step is simply bypassed by withReleaseSigning.
        id: keystore
        uses: actions/cache@v4
        with:
          path: credentials
          # The key string is deliberately unchanged by the Arkify rename: it
          # restores the existing signing identity, while a new key would mint
          # a fresh keystore that could never update the installed app.
          key: audia-signing-keystore-v1

      - name: Create signing key if missing
        if: steps.keystore.outputs.cache-hit != 'true'
        # The password is generated fresh at keystore-creation time and lives
        # ONLY in the cached credentials/keystore.json -- never in this
        # repository. The keystore itself never leaves the Actions cache.
        run: |
          mkdir -p credentials
          KS=credentials/arkify-release.keystore
          KS_PASS="$(openssl rand -base64 32)"
          keytool -genkeypair -v \
            -keystore "$KS" -storetype PKCS12 \
            -alias arkify -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=ARK DURRANI (PATHAN), OU=trigxon, O=trigxon, C=IN"
          cat > credentials/keystore.json <<JSON
          {
            "keystorePath": "credentials/arkify-release.keystore",
            "storePassword": "$KS_PASS",
            "keyAlias": "arkify",
            "keyPassword": "$KS_PASS"
          }
          JSON

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build release APK
        # withReleaseSigning picks up credentials/keystore.json when present
        # (CI always provides one); without it the build stays debug-signed.
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk "output/${ARKIFY_APK}"

      - name: Verify APK is release-signed
        # Runs after the copy so it verifies the exact file that is published.
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "output/${ARKIFY_APK}"
          "$APKSIGNER" verify --print-certs "output/${ARKIFY_APK}" | grep -q "ARK DURRANI" || {
            echo "::error::APK is not signed with Arkify's release key"
            exit 1
          }

      - name: Compute SHA-256
        run: |
          cd output
          sha256sum "${ARKIFY_APK}" > "${ARKIFY_APK}.sha256"
          cat "${ARKIFY_APK}.sha256"

      - name: Verify APK branding (label must be Arkify)
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using ANDROID_HOME=$ANDROID_HOME"
          BT="$ANDROID_HOME/build-tools"
          AAPT="$(ls "$BT"/*/aapt2 2>/dev/null | sort -V | tail -1)"
          echo "aapt2: $AAPT"
          LABEL="$("$AAPT" dump badging "output/${ARKIFY_APK}" | grep -E "^application-label:|^application-label-zh" | head -1)"
          echo "Detected label line: $LABEL"
          echo "$LABEL" | grep -q "application-label:.*Arkify" || {
            echo "::error::APK application label is not 'Arkify'"
            exit 1
          }
          PKG="$("$AAPT" dump badging "output/${ARKIFY_APK}" | grep "^package:" | head -1)"
          echo "Detected package line: $PKG"
          echo "$PKG" | grep -q "com.trigxon.arkify" || {
            echo "::error::APK package is not com.trigxon.arkify"
            exit 1
          }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arkify-v${{ env.ARKIFY_VERSION }}-apk
          path: |
            output/${{ env.ARKIFY_APK }}
            output/${{ env.ARKIFY_APK }}.sha256
          if-no-files-found: error
